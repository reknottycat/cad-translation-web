# =====================================================================
# CAD Translation System — CNB 自动发布流程
# ---------------------------------------------------------------------
# 本配置把"本地打包"与"CNB 自动化"解耦：
#   - CI 校验层：每次 push / PR 自动做后端测试 + 前端 lint/build 验证，
#     保证合入的代码始终可构建、可测试。
#   - 发版层：打 Tag（v*）时自动构建前端、云端交叉打包 Windows 便携 EXE、
#     打包源码交付包，并发布 Release（EXE zip 与源码包均作为附件上传）。
#   - 手动层：可在 CNB Web 页面通过 .cnb/web_trigger.yml 按钮手动打包/发版。
#
# Windows EXE 云端交叉打包原理：
#   CNB 云端构建节点为 Linux 容器，无 Windows 节点（原"自托管 Windows
#   Runner"方案实际不可用）。这里使用 batonogov/pyinstaller-windows 镜像
#   （Ubuntu + Wine + Windows Python + PyInstaller）在云端交叉编译出
#   真实的 Windows launcher.exe，与本地 scripts/build_scale_exe.ps1 的
#   产物逻辑一致（同一个 launcher.py / pyinstaller_manifest.py）。
#   依赖 CAD 软件 COM 自动化的第一阶段 scale_release/ 仍需本地
#   scripts/build_scale.ps1 生成。
#
# pip 源说明：CNB 云端节点访问清华 TUNA 会 403，统一使用阿里云 PyPI 镜像。
# =====================================================================

# ── 主分支 / 开发分支：推送即校验 ────────────────────────────────────
main:
  push:
    - name: ci-backend
      docker:
        image: python:3.11
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      stages:
        - name: install-deps
          script: pip install -r requirements.txt
        - name: compile-check
          script: |
            python -m compileall -q backend/app || exit 1
            echo "backend python sources compile OK"
        - name: run-tests
          # 仓库当前无测试文件时自动跳过，存在 tests/ 时执行 pytest
          script: |
            if find . -path ./node_modules -prune -o -name "test_*.py" -print -quit | grep -q .; then
              python -m pytest -q || exit 1
            else
              echo "no test files found, skipping pytest"
            fi
    - name: ci-frontend
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            cd frontend
            npm install
        - name: lint
          script: |
            cd frontend
            npm run lint
        - name: build
          script: |
            cd frontend
            npm run build

# ── 兜底分支：合并请求 / 打 Tag / 手动触发 / 未知分支推送 ─────────────
"$":
  # 合并请求：预合并代码校验
  pull_request:
    - name: pr-check-backend
      docker:
        image: python:3.11
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      stages:
        - name: install-deps
          script: pip install -r requirements.txt
        - name: run-tests
          script: |
            if find . -path ./node_modules -prune -o -name "test_*.py" -print -quit | grep -q .; then
              python -m pytest -q || exit 1
            else
              echo "no test files found, skipping pytest"
            fi
    - name: pr-check-frontend
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            cd frontend
            npm install
        - name: lint
          script: |
            cd frontend
            npm run lint
        - name: build
          script: |
            cd frontend
            npm run build

  # 打 Tag（v*）发版：前端构建 + Windows EXE 交叉打包 + 源码交付包 + 发布 Release
  tag_push:
    - name: release
      docker:
        image: python:3.11
      env:
        RELEASE_VERSION: $CNB_BRANCH
        RELEASE_ROOT: $CNB_BUILD_WORKSPACE/release_out
      stages:
        - name: build-frontend
          image: node:20
          script: |
            set -e
            cd frontend
            npm install
            npm run build
        - name: assemble-exe-payload
          # 组装 PyInstaller 打包所需的 runtime_payload.zip
          # （后端源码 + 前端构建产物 + tools，已剔除敏感/开发文件）
          script: |
            set -e
            python scripts/build_exe_payload.py --root . --output runtime_payload.zip
            ls -lh runtime_payload.zip
        - name: build-windows-exe
          # Wine + Windows Python 交叉打包出真实 Windows launcher.exe
          image: batonogov/pyinstaller-windows:latest
          env:
            PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
          script: |
            set -e
            echo "== [wine] installing python dependencies =="
            if ! pip install -r requirements.txt email_validator; then
              echo "WARN: full pip install failed; retrying without pywin32"
              grep -iv pywin32 requirements.txt > /tmp/req-nowin.txt
              pip install -r /tmp/req-nowin.txt email_validator
            fi
            echo "== [wine] running pyinstaller =="
            python release_exe/run_pyinstaller.py runtime_payload.zip
            ls -la dist/launcher | head -20
        - name: package-release
          # 产出两个交付物：
          #   1) cad-translation-web-<tag>-windows-exe.zip  Windows 便携 EXE
          #   2) cad-translation-release-<tag>.tar.gz       跨平台源码交付包
          script: |
            set -e
            VERSION_SAFE="$(printf '%s' "$RELEASE_VERSION" | tr '/' '-')"
            EXE_ZIP="$CNB_BUILD_WORKSPACE/cad-translation-web-${VERSION_SAFE}-windows-exe.zip"

            mkdir -p scale_release_exe
            cp -r dist/launcher/. scale_release_exe/
            cat > scale_release_exe/README.md <<'EXE_README'
            # CAD Translation Portable EXE

            - `launcher.exe` 是主入口，双击运行。
            - `_internal/` 包含 PyInstaller 收集的 Python 运行时与依赖库。
            - 首次启动会把内嵌的 runtime_payload.zip 解压到临时目录并启动本地服务，
              随后自动打开浏览器；关闭窗口即退出。

            本包独立于第一阶段的 `scale_release/` 运行时包（后者依赖本地 CAD 软件 COM，
            由 scripts/build_scale.ps1 生成）。
            EXE_README
            python - "$EXE_ZIP" <<'PY_ZIP'
            import os
            import sys
            import zipfile

            out = sys.argv[1]
            root = "scale_release_exe"
            with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
                for base, _, files in os.walk(root):
                    for name in sorted(files):
                        path = os.path.join(base, name)
                        zf.write(path, os.path.relpath(path, root))
            print("packed exe bundle:", out, os.path.getsize(out), "bytes")
            PY_ZIP

            ROOT="$RELEASE_ROOT"
            mkdir -p "$ROOT/backend" "$ROOT/frontend/dist" "$ROOT/docs/modern" "$ROOT/tools"
            # 复制后端源码（排除开发/缓存/密钥文件），用 tar 流式过滤避免依赖 rsync
            tar -cf - \
              --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
              --exclude='.env' --exclude='.env.*' --exclude='*.db' --exclude='runtime_config.local.json' \
              --exclude='outputs' --exclude='uploads' --exclude='temp' \
              -C backend . | tar -xf - -C "$ROOT/backend"
            cp -r frontend/dist/. "$ROOT/frontend/dist/"
            cp -r docs/modern/. "$ROOT/docs/modern/"
            cp requirements.txt "$ROOT/requirements.txt"
            echo "CAD Translation Web Release $RELEASE_VERSION" > "$ROOT/README.md"
            echo "Windows portable exe is attached as cad-translation-web-${VERSION_SAFE}-windows-exe.zip." >> "$ROOT/README.md"
            cd "$CNB_BUILD_WORKSPACE"
            tar -czf "cad-translation-release-${VERSION_SAFE}.tar.gz" -C release_out .
            ls -lh "$EXE_ZIP" "cad-translation-release-${VERSION_SAFE}.tar.gz"
        - name: create-release
          type: git:release
          options:
            description: "CAD Translation Web 自动发布 $RELEASE_VERSION。

            包含：
            - cad-translation-web-*-windows-exe.zip：Windows 便携版，解压后双击 launcher.exe 即可运行
            - cad-translation-release-*.tar.gz：跨平台源码交付包（含前端构建产物）

            变更说明见 CHANGELOG（如存在）与 docs/modern/RELEASE_SCALE.md。"
        - name: upload-assets
          # 把 EXE zip 与源码交付包挂为该 Tag Release 的附件（尽力而为）
          script: |
            set -e
            VERSION_SAFE="$(printf '%s' "$RELEASE_VERSION" | tr '/' '-')"
            EXE_ZIP="$CNB_BUILD_WORKSPACE/cad-translation-web-${VERSION_SAFE}-windows-exe.zip"
            SRC_TGZ="$CNB_BUILD_WORKSPACE/cad-translation-release-${VERSION_SAFE}.tar.gz"
            REPO="$CNB_GROUP_SLUG/$CNB_REPO_NAME"
            python scripts/upload_artifact.py --tag "$RELEASE_VERSION" --repo "$REPO" --file "$EXE_ZIP" \
              || echo "EXE upload skipped (Release may not be ready yet)"
            python scripts/upload_artifact.py --tag "$RELEASE_VERSION" --repo "$REPO" --file "$SRC_TGZ" \
              || echo "source upload skipped"

  # 手动触发：仅打包（不发布 Release）
  web_trigger_pack:
    - name: manual-pack
      docker:
        image: node:20
      env:
        RELEASE_VERSION: manual
        RELEASE_ROOT: $CNB_BUILD_WORKSPACE/release_out
      stages:
        - name: install-deps
          script: |
            cd frontend
            npm install
        - name: build-frontend
          script: |
            cd frontend
            npm run build
        - name: package-release
          script: |
            set -e
            ROOT="$RELEASE_ROOT"
            mkdir -p "$ROOT/backend" "$ROOT/frontend/dist" "$ROOT/docs/modern" "$ROOT/tools"
            tar -cf - \
              --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
              --exclude='.env' --exclude='.env.*' --exclude='*.db' --exclude='runtime_config.local.json' \
              --exclude='outputs' --exclude='uploads' --exclude='temp' \
              -C backend . | tar -xf - -C "$ROOT/backend"
            cp -r frontend/dist/. "$ROOT/frontend/dist/"
            cp -r docs/modern/. "$ROOT/docs/modern/"
            cp requirements.txt "$ROOT/requirements.txt"
            cd "$CNB_BUILD_WORKSPACE"
            tar -czf "cad-translation-release-manual.tar.gz" -C release_out .
            ls -lh "cad-translation-release-manual.tar.gz"

  # 手动触发：打包并发布 Release（按当前分支）
  web_trigger_release:
    - name: manual-release
      docker:
        image: node:20
      env:
        RELEASE_VERSION: $CNB_BRANCH
        RELEASE_ROOT: $CNB_BUILD_WORKSPACE/release_out
      stages:
        - name: install-deps
          script: |
            cd frontend
            npm install
        - name: build-frontend
          script: |
            cd frontend
            npm run build
        - name: package-release
          script: |
            set -e
            ROOT="$RELEASE_ROOT"
            mkdir -p "$ROOT/backend" "$ROOT/frontend/dist" "$ROOT/docs/modern" "$ROOT/tools"
            tar -cf - \
              --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
              --exclude='.env' --exclude='.env.*' --exclude='*.db' --exclude='runtime_config.local.json' \
              --exclude='outputs' --exclude='uploads' --exclude='temp' \
              -C backend . | tar -xf - -C "$ROOT/backend"
            cp -r frontend/dist/. "$ROOT/frontend/dist/"
            cp -r docs/modern/. "$ROOT/docs/modern/"
            cp requirements.txt "$ROOT/requirements.txt"
            cd "$CNB_BUILD_WORKSPACE"
            tar -czf "cad-translation-release-$RELEASE_VERSION.tar.gz" -C release_out .
            ls -lh "cad-translation-release-$RELEASE_VERSION.tar.gz"
        - name: create-release
          type: git:release
          options:
            description: "CAD Translation Web 手动发布 $RELEASE_VERSION。

            本包为跨平台源码交付包；Windows 便携 EXE 请打 Tag 或使用「生成 Windows EXE」按钮。"

  # 手动触发（页面按钮）：云端交叉打包 Windows EXE（无需自托管 Runner）
  web_trigger_exe:
    - name: manual-exe
      docker:
        image: python:3.11
      stages:
        - name: build-frontend
          image: node:20
          script: |
            set -e
            cd frontend
            npm install
            npm run build
        - name: assemble-exe-payload
          script: |
            set -e
            python scripts/build_exe_payload.py --root . --output runtime_payload.zip
            ls -lh runtime_payload.zip
        - name: build-windows-exe
          image: batonogov/pyinstaller-windows:latest
          env:
            PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
          script: |
            set -e
            if ! pip install -r requirements.txt email_validator; then
              echo "WARN: full pip install failed; retrying without pywin32"
              grep -iv pywin32 requirements.txt > /tmp/req-nowin.txt
              pip install -r /tmp/req-nowin.txt email_validator
            fi
            python release_exe/run_pyinstaller.py runtime_payload.zip
            ls -la dist/launcher | head -20
        - name: package-exe
          script: |
            set -e
            VERSION_SAFE="$(printf '%s' "$CNB_BRANCH" | tr '/' '-')"
            EXE_ZIP="$CNB_BUILD_WORKSPACE/cad-translation-web-${VERSION_SAFE}-windows-exe.zip"
            mkdir -p scale_release_exe
            cp -r dist/launcher/. scale_release_exe/
            cat > scale_release_exe/README.md <<'EXE_README'
            # CAD Translation Portable EXE

            - `launcher.exe` 是主入口，双击运行。
            - `_internal/` 包含 PyInstaller 收集的 Python 运行时与依赖库。
            - 首次启动会把内嵌的 runtime_payload.zip 解压到临时目录并启动本地服务，
              随后自动打开浏览器；关闭窗口即退出。
            EXE_README
            python - "$EXE_ZIP" <<'PY_ZIP'
            import os
            import sys
            import zipfile

            out = sys.argv[1]
            root = "scale_release_exe"
            with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
                for base, _, files in os.walk(root):
                    for name in sorted(files):
                        path = os.path.join(base, name)
                        zf.write(path, os.path.relpath(path, root))
            print("packed exe bundle:", out, os.path.getsize(out), "bytes")
            PY_ZIP
            ls -lh "$EXE_ZIP"
            echo "$EXE_ZIP" > exe_artifact_path.txt
        - name: upload-asset
          # 尽力上传到与当前分支/Tag 同名的 Release；不存在则跳过
          script: |
            set -e
            EXE_ZIP="$(cat exe_artifact_path.txt)"
            REPO="$CNB_GROUP_SLUG/$CNB_REPO_NAME"
            python scripts/upload_artifact.py --tag "$CNB_BRANCH" --repo "$REPO" --file "$EXE_ZIP" || \
              echo "no Release matches '$CNB_BRANCH'; skip upload (artifact: $EXE_ZIP)"

  # API 触发：云端交叉打包 Windows EXE（供自动化/脚本调用，效果同 web_trigger_exe）
  api_trigger_exe:
    - name: api-exe
      docker:
        image: python:3.11
      stages:
        - name: build-frontend
          image: node:20
          script: |
            set -e
            cd frontend
            npm install
            npm run build
        - name: assemble-exe-payload
          script: |
            set -e
            python scripts/build_exe_payload.py --root . --output runtime_payload.zip
            ls -lh runtime_payload.zip
        - name: build-windows-exe
          image: batonogov/pyinstaller-windows:latest
          env:
            PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
          script: |
            set -e
            if ! pip install -r requirements.txt email_validator; then
              echo "WARN: full pip install failed; retrying without pywin32"
              grep -iv pywin32 requirements.txt > /tmp/req-nowin.txt
              pip install -r /tmp/req-nowin.txt email_validator
            fi
            python release_exe/run_pyinstaller.py runtime_payload.zip
            ls -la dist/launcher | head -20
        - name: package-exe
          script: |
            set -e
            VERSION_SAFE="$(printf '%s' "$CNB_BRANCH" | tr '/' '-')"
            EXE_ZIP="$CNB_BUILD_WORKSPACE/cad-translation-web-${VERSION_SAFE}-windows-exe.zip"
            mkdir -p scale_release_exe
            cp -r dist/launcher/. scale_release_exe/
            cat > scale_release_exe/README.md <<'EXE_README'
            # CAD Translation Portable EXE

            - `launcher.exe` 是主入口，双击运行。
            - `_internal/` 包含 PyInstaller 收集的 Python 运行时与依赖库。
            - 首次启动会把内嵌的 runtime_payload.zip 解压到临时目录并启动本地服务，
              随后自动打开浏览器；关闭窗口即退出。
            EXE_README
            python - "$EXE_ZIP" <<'PY_ZIP'
            import os
            import sys
            import zipfile

            out = sys.argv[1]
            root = "scale_release_exe"
            with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
                for base, _, files in os.walk(root):
                    for name in sorted(files):
                        path = os.path.join(base, name)
                        zf.write(path, os.path.relpath(path, root))
            print("packed exe bundle:", out, os.path.getsize(out), "bytes")
            PY_ZIP
            ls -lh "$EXE_ZIP"
            echo "$EXE_ZIP" > exe_artifact_path.txt
        - name: upload-asset
          script: |
            set -e
            EXE_ZIP="$(cat exe_artifact_path.txt)"
            REPO="$CNB_GROUP_SLUG/$CNB_REPO_NAME"
            python scripts/upload_artifact.py --tag "$CNB_BRANCH" --repo "$REPO" --file "$EXE_ZIP" || \
              echo "no Release matches '$CNB_BRANCH'; skip upload (artifact: $EXE_ZIP)"

  # 未知分支推送：基础语法校验
  push:
    - name: ci-backend-syntax
      docker:
        image: python:3.11
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      stages:
        - name: compile-check
          script: |
            python -m compileall -q backend/app || exit 1
            echo "backend python sources compile OK"
