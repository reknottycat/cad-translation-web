# =====================================================================
# CAD Translation System — CNB 自动发布流程
# ---------------------------------------------------------------------
# 本配置把"本地打包"与"CNB 自动化"解耦：
#   - CI 校验层：每次 push / PR 自动做后端测试 + 前端 lint/build 验证，
#     保证合入的代码始终可构建、可测试。
#   - 发版层：打 Tag（v*）时自动构建前端、打包源码交付包，并发布 Release。
#   - 手动层：可在 CNB Web 页面通过 .cnb/web_trigger.yml 按钮手动打包/发版。
# 说明：真正的 Windows 最终交付包（scale_release/）依赖 CAD 软件 COM
# 自动化，仅能由本地 scripts/build_scale.ps1 生成；CNB 负责版本化制品
# 分发与自动化校验，二者互补。
# =====================================================================

# ── 主分支 / 开发分支：推送即校验 ────────────────────────────────────
main:
  push:
    - name: ci-backend
      docker:
        image: python:3.11
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      stages:
        - name: install-deps
          script: pip install -r requirements.txt
        - name: compile-check
          script: |
            python -m compileall -q backend/app || exit 1
            echo "backend python sources compile OK"
        - name: run-tests
          # 仓库当前无测试文件时自动跳过，存在 tests/ 时执行 pytest
          script: |
            if find . -path ./node_modules -prune -o -name "test_*.py" -print -quit | grep -q .; then
              python -m pytest -q || exit 1
            else
              echo "no test files found, skipping pytest"
            fi
    - name: ci-frontend
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            cd frontend
            npm install
        - name: lint
          script: |
            cd frontend
            npm run lint
        - name: build
          script: |
            cd frontend
            npm run build

# ── 兜底分支：合并请求 / 打 Tag / 手动触发 / 未知分支推送 ─────────────
"$":
  # 合并请求：预合并代码校验
  pull_request:
    - name: pr-check-backend
      docker:
        image: python:3.11
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      stages:
        - name: install-deps
          script: pip install -r requirements.txt
        - name: run-tests
          script: |
            if find . -path ./node_modules -prune -o -name "test_*.py" -print -quit | grep -q .; then
              python -m pytest -q || exit 1
            else
              echo "no test files found, skipping pytest"
            fi
    - name: pr-check-frontend
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            cd frontend
            npm install
        - name: lint
          script: |
            cd frontend
            npm run lint
        - name: build
          script: |
            cd frontend
            npm run build

  # 打 Tag（v*）发版：构建前端 + 打包交付包 + 发布 Release
  tag_push:
    - name: release
      docker:
        image: node:20
      env:
        RELEASE_VERSION: $CNB_BRANCH
        RELEASE_ROOT: $CNB_BUILD_WORKSPACE/release_out
      stages:
        - name: install-deps
          script: |
            cd frontend
            npm install
        - name: build-frontend
          script: |
            cd frontend
            npm run build
        - name: package-release
          # 组装跨平台源码交付包（后端 + 前端构建产物 + 文档 + 依赖清单）
          script: |
            set -e
            ROOT="$RELEASE_ROOT"
            mkdir -p "$ROOT/backend" "$ROOT/frontend/dist" "$ROOT/docs/modern" "$ROOT/tools"
            # 复制后端源码（排除开发/缓存/密钥文件），用 tar 流式过滤避免依赖 rsync
            tar -cf - \
              --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
              --exclude='.env' --exclude='.env.*' --exclude='*.db' --exclude='runtime_config.local.json' \
              --exclude='outputs' --exclude='uploads' --exclude='temp' \
              -C backend . | tar -xf - -C "$ROOT/backend"
            cp -r frontend/dist/. "$ROOT/frontend/dist/"
            cp -r docs/modern/. "$ROOT/docs/modern/"
            cp requirements.txt "$ROOT/requirements.txt"
            echo "CAD Translation Web Release $RELEASE_VERSION" > "$ROOT/README.md"
            echo "Generated by CNB pipeline. For the Windows delivery bundle, run scripts/build_scale.ps1 locally." >> "$ROOT/README.md"
            cd "$CNB_BUILD_WORKSPACE"
            tar -czf "cad-translation-release-$RELEASE_VERSION.tar.gz" -C release_out .
            ls -lh "cad-translation-release-$RELEASE_VERSION.tar.gz"
        - name: create-release
          type: git:release
          options:
            description: "CAD Translation Web 自动发布 $RELEASE_VERSION。\n\n本包为跨平台源码交付包；Windows 最终交付包（scale_release/）请在本机运行 scripts/build_scale.ps1 生成。\n\n变更说明见 CHANGELOG（如存在）与 docs/modern/RELEASE_SCALE.md。"

    # 打 Tag（v*）发版：Windows 自托管 Runner 生成便携 EXE 交付包
    # 说明：仅在已接入 Windows 自托管 Runner（标签含 windows）时才会命中；
    #       未接入时该流水线会因找不到节点而跳过/失败，可忽略或用 web_trigger_exe 手动触发。
    - name: release-exe
      runner:
        namespace: group        # 使用根组织自托管构建节点
        tags:
          - windows             # 节点需声明 windows 标签（如 [windows, win11, msvc2022]）
      env:
        RELEASE_VERSION: $CNB_BRANCH
        EXE_ARTIFACT: $CNB_BUILD_WORKSPACE/cad-translation-web-$CNB_BRANCH-windows-exe.zip
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      stages:
        - name: prepare-env
          # self-hosted Windows runner 上脚本默认走 PowerShell
          script: |
            $ErrorActionPreference = "Stop"
            cmd /c ver
            Write-Host "Python: $((python --version) 2>&1)"
            Write-Host "Node  : $((node --version) 2>&1)"
            Write-Host "npm   : $((npm --version) 2>&1)"
            python -m pip install --upgrade pip
            pip install -r requirements.txt pyinstaller
        - name: build-frontend
          script: |
            Set-Location frontend
            npm install
            npm run build
            Set-Location ..
        - name: build-exe
          script: |
            powershell -ExecutionPolicy Bypass -File scripts/build_scale_exe.ps1 -Root (Get-Location).Path
        - name: package-exe
          script: |
            $outDir = Join-Path (Get-Location).Path "scale_release_exe"
            if (-not (Test-Path $outDir)) { throw "scale_release_exe not found" }
            Compress-Archive -Path (Join-Path $outDir "*") -DestinationPath $env:EXE_ARTIFACT -Force
            Get-Item $env:EXE_ARTIFACT | Select-Object Name, Length
        - name: upload-asset
          # 尽力将 EXE zip 挂到同一 Tag 的 Release 附件（由 release 流水线创建）；
          # 上传失败不影响主流程（EXE 产物仍保留在构建产物中可直接下载）。
          script: |
            try {
              powershell -ExecutionPolicy Bypass -File scripts/upload_release_asset.ps1 `
                -Repo "$env:CNB_GROUP_SLUG/$env:CNB_REPO_NAME" `
                -Tag "$env:RELEASE_VERSION" `
                -File $env:EXE_ARTIFACT `
                -AssetName (Split-Path $env:EXE_ARTIFACT -Leaf) `
                -Token $env:CNB_TOKEN
            } catch {
              Write-Warning "upload-asset skipped: $_"
            }

  # 手动触发：仅打包（不发布 Release）
  web_trigger_pack:
    - name: manual-pack
      docker:
        image: node:20
      env:
        RELEASE_VERSION: manual
        RELEASE_ROOT: $CNB_BUILD_WORKSPACE/release_out
      stages:
        - name: install-deps
          script: |
            cd frontend
            npm install
        - name: build-frontend
          script: |
            cd frontend
            npm run build
        - name: package-release
          script: |
            set -e
            ROOT="$RELEASE_ROOT"
            mkdir -p "$ROOT/backend" "$ROOT/frontend/dist" "$ROOT/docs/modern" "$ROOT/tools"
            tar -cf - \
              --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
              --exclude='.env' --exclude='.env.*' --exclude='*.db' --exclude='runtime_config.local.json' \
              --exclude='outputs' --exclude='uploads' --exclude='temp' \
              -C backend . | tar -xf - -C "$ROOT/backend"
            cp -r frontend/dist/. "$ROOT/frontend/dist/"
            cp -r docs/modern/. "$ROOT/docs/modern/"
            cp requirements.txt "$ROOT/requirements.txt"
            cd "$CNB_BUILD_WORKSPACE"
            tar -czf "cad-translation-release-manual.tar.gz" -C release_out .
            ls -lh "cad-translation-release-manual.tar.gz"

  # 手动触发：打包并发布 Release（按当前分支）
  web_trigger_release:
    - name: manual-release
      docker:
        image: node:20
      env:
        RELEASE_VERSION: $CNB_BRANCH
        RELEASE_ROOT: $CNB_BUILD_WORKSPACE/release_out
      stages:
        - name: install-deps
          script: |
            cd frontend
            npm install
        - name: build-frontend
          script: |
            cd frontend
            npm run build
        - name: package-release
          script: |
            set -e
            ROOT="$RELEASE_ROOT"
            mkdir -p "$ROOT/backend" "$ROOT/frontend/dist" "$ROOT/docs/modern" "$ROOT/tools"
            tar -cf - \
              --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
              --exclude='.env' --exclude='.env.*' --exclude='*.db' --exclude='runtime_config.local.json' \
              --exclude='outputs' --exclude='uploads' --exclude='temp' \
              -C backend . | tar -xf - -C "$ROOT/backend"
            cp -r frontend/dist/. "$ROOT/frontend/dist/"
            cp -r docs/modern/. "$ROOT/docs/modern/"
            cp requirements.txt "$ROOT/requirements.txt"
            cd "$CNB_BUILD_WORKSPACE"
            tar -czf "cad-translation-release-$RELEASE_VERSION.tar.gz" -C release_out .
            ls -lh "cad-translation-release-$RELEASE_VERSION.tar.gz"
        - name: create-release
          type: git:release
          options:
            description: "CAD Translation Web 手动发布 $RELEASE_VERSION。\n\n本包为跨平台源码交付包；Windows 最终交付包（scale_release/）请在本机运行 scripts/build_scale.ps1 生成。"

  # 手动触发：Windows 自托管 Runner 生成便携 EXE（不发布 Release）
  web_trigger_exe:
    - name: manual-exe
      runner:
        namespace: group        # 使用根组织自托管构建节点
        tags:
          - windows             # 节点需声明 windows 标签
      env:
        RELEASE_VERSION: $CNB_BRANCH
        EXE_ARTIFACT: $CNB_BUILD_WORKSPACE/cad-translation-web-$CNB_BRANCH-windows-exe.zip
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      stages:
        - name: prepare-env
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "Python: $((python --version) 2>&1)"
            Write-Host "Node  : $((node --version) 2>&1)"
            python -m pip install --upgrade pip
            pip install -r requirements.txt pyinstaller
        - name: build-frontend
          script: |
            Set-Location frontend
            npm install
            npm run build
            Set-Location ..
        - name: build-exe
          script: |
            powershell -ExecutionPolicy Bypass -File scripts/build_scale_exe.ps1 -Root (Get-Location).Path
        - name: package-exe
          script: |
            $outDir = Join-Path (Get-Location).Path "scale_release_exe"
            if (-not (Test-Path $outDir)) { throw "scale_release_exe not found" }
            Compress-Archive -Path (Join-Path $outDir "*") -DestinationPath $env:EXE_ARTIFACT -Force
            Get-Item $env:EXE_ARTIFACT | Select-Object Name, Length

  # 未知分支推送：基础语法校验
  push:
    - name: ci-backend-syntax
      docker:
        image: python:3.11
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      stages:
        - name: compile-check
          script: |
            python -m compileall -q backend/app || exit 1
            echo "backend python sources compile OK"
