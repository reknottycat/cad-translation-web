[build-system]
requires = ["setuptools>=68.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

# PEP 621 metadata. ``version`` is deliberately NOT hard-coded here: it is
# declared dynamic so setuptools delegates it to setup.py, which reads the one
# canonical SemVer source ``backend/app/version.py`` (see Issue #14).  Keeping a
# static ``version`` here would create a second, driftable source of truth.
[project]
name = "cad-translate"
description = "Local CAD drawing translation CLI (shares the backend trusted implementation)"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.7.0",
    "ezdxf>=1.3.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "PyYAML>=6.0.0",
    "requests>=2.31.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
cad-translate = "cad_translate.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0,<0.29.0",
]

[tool.setuptools.packages.find]
include = ["cad_translate", "cad_translate.*"]
